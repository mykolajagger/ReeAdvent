name = "reeadvent-inbox"
main = "src/index.js"
compatibility_date = "2025-01-01"
keep_vars = true  # змінні, додані вручну в дашборді, не стираються при деплої

[[d1_databases]]
binding = "DB"
database_name = "reeadvent-db"
database_id = "8dd4d746-1746-4168-b724-1643f99925e6"

# Необов'язково: резервна копія кожного листа на вашу пошту (адреса має бути підтверджена в Email Routing → Destination addresses).
# Задається змінною FORWARD_TO у налаштуваннях Worker (Settings → Variables), не тут.

# Щогодини о :01 (нагадування надсилаються з 09:01 за часом календаря). Потрібні змінна BASE_URL і секрет CRON_SECRET (ТОЙ САМИЙ, що й на сайті).
[triggers]
crons = ["1 * * * *", "*/2 * * * *"]

[vars]
BASE_URL = "https://reeadvent.fun"

# Журнали запусків cron видно в Worker → Logs (безкоштовний ліміт: 200 тис. подій на добу)
[observability]
enabled = true
