name: Наповнення бази закладів із вигрузок OSM (Geofabrik)

# Надійний варіант для тисяч міст: щоденні вигрузки OpenStreetMap по країнах замість запитів до публічного Overpass.
# Країни беруться з черги міст у D1 (спершу ті, де є міста клієнтів). Секрети: CLOUDFLARE_API_TOKEN (D1 → Edit), CLOUDFLARE_ACCOUNT_ID.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      countries:
        description: 'Необов’язково: коди країн через пробіл (наприклад UA PL). Порожньо — за чергою.'
        required: false
        default: ''

concurrency:
  group: venues-bulk
  cancel-in-progress: false

jobs:
  bulk:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Встановити osmium
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool && osmium --version | head -1
      - name: Наповнити базу закладів
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: 8dd4d746-1746-4168-b724-1643f99925e6
          BUDGET_MIN: '300'
          MAX_PBF_GB: '8'
          MAX_DOWNLOAD_GB: '30'
          WORK_DIR: ${{ runner.temp }}/bulk
          COUNTRIES: ${{ github.event.inputs.countries }}
        run: |
          mkdir -p "$WORK_DIR"
          node tools/bulk-venues.mjs $COUNTRIES
