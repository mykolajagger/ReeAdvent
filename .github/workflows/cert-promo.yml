name: Подарунковий сертифікат (одноразовий промокод 100%)

# Генерує код на сервері й записує в базу. У журнал іде лише зашифрований код (розшифровує власник закритого ключа).
on:
  workflow_dispatch:
    inputs:
      pubkey:
        description: 'Відкритий ключ (base64 PEM) для шифрування коду'
        required: true
      label:
        description: 'Позначка в адмінці'
        required: false
        default: 'Подарунковий сертифікат'
      until:
        description: 'Діє до (YYYY-MM-DD)'
        required: false
        default: '2027-11-30'

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: 8dd4d746-1746-4168-b724-1643f99925e6
          PUBKEY: ${{ github.event.inputs.pubkey }}
          LABEL: ${{ github.event.inputs.label }}
          UNTIL: ${{ github.event.inputs.until }}
        run: node tools/cert-promo.mjs
