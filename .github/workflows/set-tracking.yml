name: Змінити ID відстеження (піксель Meta, GA4, Google Ads)

# Те саме, що адмінка → Соцмережі й реклама → Реклама → Відстеження. Змінює лише один ключ відстеження в налаштуваннях.
on:
  workflow_dispatch:
    inputs:
      key:
        description: 'Що змінити'
        required: true
        type: choice
        options: [meta, ga4, gads, gads_label]
      value:
        description: 'Нове значення (порожнє вимикає інструмент)'
        required: false
        default: ''

jobs:
  set:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Записати
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: 8dd4d746-1746-4168-b724-1643f99925e6
        run: node tools/set-tracking.mjs "${{ github.event.inputs.key }}" "${{ github.event.inputs.value }}"
