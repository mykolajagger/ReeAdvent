name: Наповнення бази закладів (OpenStreetMap)

# Публічний Overpass не відповідає з Cloudflare, тому наповнення працює тут: запити йдуть із серверів GitHub, запис у D1 через REST API.
# Потрібні секрети репозиторію: CLOUDFLARE_API_TOKEN (права Account → D1 → Edit) і CLOUDFLARE_ACCOUNT_ID.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]    # чотири незалежні виконавці з різними адресами; міста «захоплюються», тож не дублюються
    concurrency:
      group: venues-${{ matrix.shard }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Наповнити бази закладів
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: 8dd4d746-1746-4168-b724-1643f99925e6
          BUDGET_MIN: '12'
          VENUES_CONCURRENCY: '4'
        run: node tools/fill-venues.mjs
